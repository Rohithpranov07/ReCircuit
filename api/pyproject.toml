[project]
name = "recircuit"
version = "0.1.0"
description = "ReCircuit API and seed generator"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.142.2",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.13.5",
  "psycopg[binary,pool]==3.3.6",
  "pyjwt==2.15.1",
  "passlib[bcrypt]==1.7.4",
  "qrcode[pil]==8.2",
  "bcrypt==4.0.1",   # passlib 1.7.4 breaks with bcrypt >= 4.1
]

[project.optional-dependencies]
# dependencies of the seed generator (python -m seed); the API's own dependencies are added in T3.2
seed = [
  "psycopg[binary,pool]==3.3.6",
  "faker==40.40.0",
  "bcrypt==4.0.1",
]
dev = [
  "ruff==0.16.10",
  "mypy==2.4.0",
  "types-passlib==1.7.7.20260211",
  "types-qrcode",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "httpx==0.28.1",
  "testcontainers[postgres]==4.15.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.mypy]
strict = true
ignore_missing_imports = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Cookie"]

[tool.ruff.lint.per-file-ignores]
# FastAPI declares dependencies as call expressions in parameter defaults (Depends(require_roles(...)))
"app/routers/*" = ["B008"]
"tests/*" = ["B008"]
