services:
  db:
    image: postgres:16
    env_file: .env
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${DB_HOST_PORT:-5432}:5432"
    volumes:
      - recircuit_pgdata:/var/lib/postgresql/data
      - ./db/bootstrap:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d recircuit"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot: applies the migrations as rc_owner, then exits.
  migrate:
    image: ghcr.io/amacneil/dbmate:2.36.0
    env_file: .env
    environment:
      DATABASE_URL: ${MIGRATION_DATABASE_URL}
      DBMATE_MIGRATIONS_DIR: /db/migrations
      DBMATE_MIGRATIONS_TABLE: dbmate.schema_migrations
      DBMATE_NO_DUMP_SCHEMA: "true"
      DBMATE_WAIT: "true"
    volumes:
      - ./db/migrations:/db/migrations:ro
    command: up
    depends_on:
      db:
        condition: service_healthy

  # One-shot: fills an empty database with the small demo world through the same routines the API uses.
  # A database that already holds data is left alone (the seed refuses it with exit code 2).
  seed:
    image: python:3.12-slim
    env_file: .env
    environment:
      SEED_DATABASE_URL: postgresql://rc_owner:${RC_OWNER_PASSWORD}@db:5432/recircuit
      PIP_ROOT_USER_ACTION: ignore
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    working_dir: /srv
    volumes:
      - ./seed:/srv/seed:ro
    command: >
      sh -c 'pip install -q "psycopg[binary,pool]==3.3.6" "faker==40.40.0" "bcrypt==4.0.1"
      && (python -m seed --profile small --seed 42 || [ $$? -eq 2 ])'
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    build: ./api
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - "8000:8000"
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: ./web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5173/"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  recircuit_pgdata:
